server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri.html $uri/ =404;
	}

	location ~* \.(?:css|js|mjs|json|map|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2)$ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	error_page 404 /404.html;
}
